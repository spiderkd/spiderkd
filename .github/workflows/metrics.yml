name: Metrics
on:
  # Runs automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:
  # Runs once on push so you can see it work immediately
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spiderkd
          filename: metrics.isocalendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spiderkd
          filename: metrics.skyline.svg
          template: classic
          base: ""
          plugin_skyline: yes
          plugin_skyline_frames: 4
