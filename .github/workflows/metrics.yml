name: Metrics
on:
  schedule:
    - cron: "0 */12 * * *"   # refresh every 12 hours
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card 1 — the isocalendar (your "3D commit graph")
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spiderkd
          filename: metrics.isocalendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Card 2 — everything else you wanted, stacked in one render
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spiderkd
          filename: metrics.plugins.svg
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_notable: yes
          plugin_notable_from: all
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_stargazers: yes
          plugin_stargazers_charts: yes

      # Optional 3rd card — Anilist watch/reading list.
      # Uncomment and fill in your Anilist username if you want to try it.
      # - uses: lowlighter/metrics@latest
      #   with:
      #     token: ${{ secrets.METRICS_TOKEN }}
      #     user: spiderkd
      #     filename: metrics.anilist.svg
      #     template: classic
      #     base: ""
      #     plugin_anilist: yes
      #     plugin_anilist_medias_limit: 4
      #     plugin_anilist_username: YOUR_ANILIST_USERNAME
